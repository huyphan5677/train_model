# Leadgen model: shop trong whitelist (WL) được mời -> có nộp hồ sơ vay TNEX trong tháng đó.
# Đường dẫn tuyệt đối theo server hitech; sửa lại nếu chạy ở máy khác.

run_name: leadgen

label:
  file: /home/hitech/repo-vtp/services/jupyter/notebooks/vtp_v2/src/notebooks/merged_customer_application_fpd.xlsx
  sheet: Merged
  key: cus_id
  snapshot_col: date          # ngày snapshot WL (YYYY-MM-01)
  positive_col: month         # có giá trị = shop đã nộp hồ sơ trong tháng snapshot
  snapshots: [20260501, 20260601, 20260701, 20260801]

split:                        # out-of-time
  train: [20260501, 20260601]
  test: [20260701, 20260801]

minio:
  connect_yaml: /home/hitech/repo-vtp/services/jupyter/notebooks/vtp_v2/src/config/connect.yaml
  endpoint: 127.0.0.1:9990    # endpoint từ host; connect.yaml ghi hostname docker
  bucket: null                # null = lấy từ connect_yaml

# Mỗi thư mục trên S3 là một group feature.
feature_sources:
  - features/demographic/final
  # - features/demographic/l1m
  - features/gmv/final
  - features/location/l1m
  - features/sales/l1m
  - features/sales/l6m
  - features/trend/final
  - features/vct/l1m
  - features/vct/l3m
  - features/cus_base/l1m
  - features/cus_base/l6m
  - features/cuoc_trongluong/l1m
  - features/cuoc_trongluong/l6m

exclude_columns:              # metadata, ngày thô, hằng số theo tháng
  - quarter
  - duration_group
  - dob
  - ngay_hoptac
  - population_cod_ship_rev_gmv_ratio_x
  - population_cod_ship_rev_gmv_ratio_y
  # Điều kiện vào WL: gần như luôn = 1 trong WL; riêng snapshot 20260601 trống 100%
  # (trend/final tháng đó không có cột) -> model học ra tháng thay vì hành vi shop.
  - delivered_orders_every_month_4m
  - delivered_orders_every_month_3m
  - delivered_orders_every_month_2m

categorical_columns:
  - top1_location_l1m

stat_filter:
  max_missing: 0.95           # bỏ nếu thiếu > 95%
  max_dominant: 0.995         # bỏ nếu một giá trị chiếm > 99,5%
  min_scaled_var: 0.001       # bỏ nếu phương sai (cắt p1–p99, đưa về [0, 1]) < 0,001
  max_equal_share: 0.99       # hai cột giống hệt ở >= 99% số dòng: bỏ cột AUC đơn biến thấp hơn
  max_spearman: 0.95          # cặp |Spearman| > 0,95: giữ biến có AUC đơn biến cao hơn
  corr_sample: 50000

selection:
  cum_importance: 0.90        # giữ feature tới khi cộng dồn importance >= 90%
  min_features_group: 1
  min_features_final: 5
  cv_folds: 3
  catboost:                   # tham số nhanh dùng cho bước chọn biến
    iterations: 600
    learning_rate: 0.05
    depth: 6
    early_stopping_rounds: 50
  # Các bước chọn biến, chạy lần lượt; mỗi bước nhận tập biến còn lại của bước trước.
  # Mỗi bước: method + tham số riêng (ghi đè mặc định). Tham số chung cho mọi bước:
  #   sample_rows: N            chạy bước đó trên mẫu ~N dòng (lấy trọn shop)
  #   min_score / min_score_rel_mean / top_k / top_pct   luật chọn theo score (null = tắt luật mặc định)
  # Phương pháp (src/features.py, METHODS):
  #   stat_filter       missing, constant, low_variance, duplicate, Spearman (tham số = khoá của stat_filter)
  #   group_importance  CatBoost CV từng group, cộng dồn importance (cum_importance, min_features, cv_folds, catboost)
  #   cum_importance    CatBoost CV toàn bộ biến, cộng dồn importance (như trên)
  #   permutation       AUC giảm khi xáo trộn biến, RandomForest (repeat, test_size, max_depth, n_estimators); mặc định > 0
  #   single_auc        AUC CV của DecisionTree chỉ một biến (cv, max_depth, min_samples_leaf); mặc định >= 0,52
  #   beat_random       importance RandomForest lớn hơn cột ngẫu nhiên (max_depth, n_estimators)
  #   l1 / l2           |hệ số| LogisticRegression (C); mặc định >= 0,1 × trung bình; categorical cho qua
  #   mutual_info       mutual information với nhãn; mặc định top 75%
  #   target_corr       |Pearson| với nhãn; mặc định >= 0,1 và top 10 (nhãn hiếm: nên hạ min_score)
  #   rfe               RFE DecisionTree (k: số biến hoặc tỷ lệ, step); mặc định k = 0,5
  #   vote              chạy nhiều phương pháp, giữ biến được >= min_share số phương pháp chọn (methods, min_share)
  steps:
    - method: stat_filter
    - method: group_importance
    - method: cum_importance
  # Ví dụ: bỏ phiếu giữa 3 phương pháp trước bước importance cuối
  # steps:
  #   - method: stat_filter
  #   - method: vote
  #     min_share: 0.67
  #     methods:
  #       - method: permutation
  #         n_estimators: 300
  #       - method: beat_random
  #         n_estimators: 300
  #       - method: mutual_info
  #         sample_rows: 50000
  #   - method: cum_importance

optuna:
  n_trials: 40
  cv_folds: 3
  timeout_sec: 3600
  max_iterations: 2000
  early_stopping_rounds: 100

seed: 42
thread_count: 14

eval:
  n_bins: 10                  # precision table theo decile
  shap_top: 10
  shap_sample: 5000
  psi_bins: 10

paths:
  cache_dir: data             # cache dữ liệu đã merge (không commit)
  output_dir: outputs/leadgen
  model_dir: models/leadgen
